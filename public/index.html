<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <title>邻传</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark"><img src="/logo.svg" alt=""></span><div><strong data-i18n="邻传">邻传</strong><small data-i18n="局域网传输">局域网传输</small></div></div>
      <button class="device-card" id="editProfile" type="button">
        <div class="avatar" id="avatar"></div>
        <div class="device-info"><strong id="displayName"></strong><span><i class="status-dot"></i> <span data-i18n="已连接">已连接</span></span></div>
        <span class="edit-symbol">✎</span>
      </button>

      <div class="section-title"><span data-i18n="会话">会话</span><button id="newGroup" title="新建群聊" aria-label="新建群聊" data-i18n-title="新建群聊" data-i18n-label="新建群聊">＋</button></div>
      <div class="chat-tabs" id="chatTabs" role="tablist" aria-label="会话类型">
        <button class="active" type="button" role="tab" data-chat-tab="group" aria-selected="true"><span data-i18n="群聊">群聊</span><b class="tab-unread hidden" id="groupUnread" aria-label="群聊未读消息">0</b></button>
        <button type="button" role="tab" data-chat-tab="dm" aria-selected="false"><span data-i18n="单聊">单聊</span><b class="tab-unread hidden" id="dmUnread" aria-label="单聊未读消息">0</b></button>
      </div>
      <nav id="chatList" class="chat-list"></nav>

      <div class="section-title"><span data-i18n="在线设备 · 点击单聊">在线设备 · 点击单聊</span><span id="onlineCount">1</span></div>
      <div id="deviceList" class="device-list"></div>
      <div class="privacy"><span>⌁</span><p><strong id="relayName">正在识别中转节点…</strong><small id="relayDetail">会话内容相互独立</small></p><button class="icon-button settings-button" id="openSettings" type="button" title="全局设置" aria-label="全局设置"><i data-lucide="settings" aria-hidden="true"></i></button></div>
    </aside>

    <section class="chat">
      <header class="chat-header">
        <button class="icon-button mobile-info" id="toggleSidebar" title="打开会话列表" aria-label="打开会话列表">☰</button>
        <div class="chat-heading"><h1 id="chatTitle">共享空间</h1><p id="chatSubtitle">所有在线设备</p></div>
        <button class="connect-button" id="openConnect" type="button" title="手机扫码连接"><span aria-hidden="true">▦</span><b>手机连接</b></button>
      </header>
      <div id="messages" class="messages"></div>
      <div class="drop-hint" id="dropHint"><strong>松开发送到当前会话</strong></div>
      <footer class="composer">
        <div id="uploadProgress" class="upload-progress hidden"><span id="uploadText"></span><div><i id="uploadBar"></i></div></div>
        <div id="pendingAttachments" class="pending-attachments hidden"></div>
        <div id="mentionMenu" class="mention-menu hidden" role="listbox"></div>
        <form id="messageForm">
          <label class="attach" title="选择文件"><input id="fileInput" type="file" multiple><span>＋</span></label>
          <button class="emoji-toggle" id="emojiToggle" type="button" title="选择表情" aria-label="选择表情">☺</button>
          <textarea id="messageInput" rows="1" maxlength="2000" placeholder="输入消息…" data-i18n-placeholder="输入消息…"></textarea>
          <button class="send" type="submit" title="发送" aria-label="发送">➤</button>
        </form>
        <div class="emoji-panel hidden" id="emojiPanel" aria-label="表情选择器"></div>
      </footer>
    </section>
  </main>

  <dialog id="groupDialog" class="modal">
    <form method="dialog" id="groupForm">
      <header><div><h2>新建群聊</h2><p>选择要加入群聊的在线设备</p></div><button value="cancel" class="icon-button" aria-label="关闭">×</button></header>
      <label class="field"><span>群聊名称</span><input id="groupName" maxlength="40" placeholder="例如：项目讨论"></label>
      <div id="groupMembers" class="member-picker"></div>
      <footer><button value="cancel" class="secondary">取消</button><button value="default" id="createGroup" class="primary">创建群聊</button></footer>
    </form>
  </dialog>

  <dialog id="profileDialog" class="modal profile-modal">
    <form method="dialog" id="profileForm">
      <header><div><h2>设备资料</h2><p>其他设备将看到此昵称和头像</p></div><button value="cancel" class="icon-button" aria-label="关闭">×</button></header>
      <label class="avatar-editor"><span class="avatar avatar-large" id="avatarPreview"></span><input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp"><b>选择头像</b><small>PNG、JPG 或 WebP</small></label>
      <label class="field"><span>设备昵称</span><input id="profileName" maxlength="30" required></label>
      <footer><button value="cancel" class="secondary">取消</button><button value="default" id="saveProfile" class="primary">保存资料</button></footer>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="modal settings-modal">
    <form method="dialog" id="settingsForm">
      <header><div><h2>全局设置</h2><p>管理当前设备的软件偏好</p></div><button value="cancel" class="icon-button" aria-label="关闭">×</button></header>
      <label class="field"><span>界面语言</span><select id="languageSetting"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
      <label class="field"><span>外观主题</span><select id="themeSetting"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <label class="setting-row">
        <span><strong>新消息提醒</strong><small>在其他会话收到消息时显示提醒</small></span>
        <input id="notificationSetting" type="checkbox"><i></i>
      </label>
      <section class="desktop-update hidden" id="desktopUpdateSettings">
        <label class="setting-row">
          <span><strong>自动检查更新</strong><small>每天最多检查一次 GitHub Release</small></span>
          <input id="autoUpdateSetting" type="checkbox"><i></i>
        </label>
        <div class="update-action"><span id="updateStatus">尚未检查更新</span><button id="checkUpdate" type="button" class="secondary">立即检查</button></div>
      </section>
      <footer><button value="cancel" class="secondary">取消</button><button value="default" class="primary">保存设置</button></footer>
    </form>
  </dialog>

  <dialog id="connectDialog" class="modal connect-modal">
    <form method="dialog">
      <header><div><h2>手机连接</h2><p>手机与电脑需连接同一个 Wi-Fi</p></div><button value="cancel" class="icon-button" aria-label="关闭">×</button></header>
      <div class="connect-content">
        <img id="connectQr" class="connect-qr" alt="手机连接二维码" width="240" height="240">
        <label class="field connect-address-field"><span>局域网地址</span><select id="connectAddress" aria-label="选择局域网地址"></select></label>
        <div class="connect-link"><code id="connectLink"></code><button id="copyConnectLink" type="button" title="复制连接地址" aria-label="复制连接地址">⧉</button></div>
      </div>
      <footer><button value="cancel" class="primary">完成</button></footer>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>
  <script src="/vendor/marked.umd.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/turndown.umd.js"></script>
  <script src="/vendor/turndown-plugin-gfm.js"></script>
  <script src="/vendor/lucide.min.js"></script>
  <script src="/markdown.js"></script>
  <script src="/rich-paste.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
